name: Build iOS IPA
on:
  push:
    branches: [ "cmp-rewrite", "cmp-reescrever" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Build iOS App
        run: |
          env NUVIO_IOS_DISTRIBUTION=full xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios-derived-full \
            CODE_SIGNING_ALLOWED=NO \
            build
            
      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/ios-derived-full/Build/Products/Release-iphoneos/iosApp.app Payload/
          zip -r Nuvio.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-iOS-IPA
          path: Nuvio.ipa
